<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0E0D">
  <title>인형뽑기 · 폰 하나로 | 도파#</title>
  <meta name="dopasharp:game" content="claw-machine">
  <link rel="canonical" href="https://dopasharp.github.io/claw-machine/">
  <meta name="description" content="폰 하나로 하는 인형뽑기. 집게에 달린 카메라로 보면서 조이스틱으로 뽑기!">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="도파# dopa.shap">
  <meta property="og:title" content="인형뽑기 🧸">
  <meta property="og:description" content="집게 카메라로 보면서 조이스틱으로 뽑기! 코인 5개로 몇 개나 뽑을 수 있을까?">
  <meta property="og:url" content="https://dopasharp.github.io/claw-machine/solo.html">
  <link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dopasharp/tokens.css">
  <link rel="stylesheet" href="dopasharp/components.css">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script src="dopasharp/dopasharp.js" defer></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
  <script type="module" src="js/machine.js?v=3"></script>
  <script type="module" src="js/pad.js?v=3"></script>
</head>
<body class="pad-page solo-page" data-mode="solo">
  <!-- 위: 집게 카메라 화면 -->
  <div class="solo-view">
    <canvas id="scene"></canvas>
    <div class="solo-hud">
      <span>🪙 <b id="hudCoins">5</b></span>
      <span>🧸 <b id="hudCaught">0</b></span>
    </div>
    <button class="view-btn solo-view-btn" data-view-toggle>🎥 기계 전체</button>
    <div id="trophyPile" class="trophy-pile" aria-label="뽑은 인형"></div>
    <p class="solo-drag-hint">화면을 끌면 돌려볼 수 있어요</p>
    <div id="banner" class="banner"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </div>

  <!-- 아래: 조이스틱 + 버튼 -->
  <section id="ctrlScreen" class="solo-ctrl" hidden>
    <div class="timebar"><i id="timeFill"></i></div>
    <div id="msg" class="screen-msg" aria-live="polite">
      <div id="msgBig" class="big">…</div>
      <div id="msgSub" class="sub"></div>
    </div>
    <div class="solo-row">
      <div id="joy" class="joy off" aria-label="조이스틱">
        <span class="arrow u">▲</span><span class="arrow d">▲</span><span class="arrow l">▲</span><span class="arrow r">▲</span>
        <div id="knob" class="knob free"></div>
      </div>
      <button id="actionBtn" class="action" disabled>…</button>
    </div>
  </section>

  <section id="startOverlay" class="overlay show">
    <header data-dopa="header"></header>
    <div class="card">
      <span class="dopa-label">ONE-PHONE MODE</span>
      <div class="hero-emoji" aria-hidden="true">🧸</div>
      <h1>인형뽑기</h1>
      <p>폰 하나로 해요. 위에는 <b>집게 카메라</b>,<br>아래는 <b>조이스틱</b>과 <b>뽑기 버튼</b>!</p>
      <p class="warn">🔊 소리가 나요 · 화면을 끌면 시점을 돌려볼 수 있어요</p>
      <button id="soloStart" class="dopa-button dopa-button--block">🪙 시작하기</button>
      <a class="dopa-button dopa-button--secondary dopa-button--block" href="./">🖥️ PC를 기계로 쓰기</a>
    </div>
    <footer data-dopa="footer"></footer>
  </section>
</body>
</html>
